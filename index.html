<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./src/style.scss">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DineVibe - musikbaserad receptmatchning</title>
</head>

<body>
  <header>
    <h1>DineVibe</h1>

    <div class="intro-message">
      <span class="intro-icon intro-icon--music">🎵</span>

      <p>
        Välj en låt. Du får sedan ett recept matchat efter låtarnas längd!
      </p>

      <span class="intro-icon intro-icon--food">
        🍽️
      </span>

      <button class="intro-close" id="intro-close" type="button">
        x
      </button>
    </div>

    <div class="search-group">
      <input type="text" id="song-input" placeholder="Skriv en låt eller artist...">
      <button id="match-btn">Hitta matchande mat</button>
    </div>
  </header>

  <main class="main-content">
    <section id="spotify-result" class="card">
      <h2>Din låt</h2>
      <div id="track-container">Klicka på knappen för att analysera...</div>
    </section>

    <section id="recipe-result" class="card">
      <h2>Rekommenderat recept</h2>
      <div id="recipe-container">Väntar på musik...</div>
    </section>

  </main>
  <footer>Projektuppgift av Rune Granath för kursen Frontendbaserad Webbutveckling</footer>
  <script type="module" src="/src/main.js"></script>

</body>

</html>
